{% if messages %}
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            {% for message in messages %}
                Swal.fire({
                    title: "",
                    text: "{{ message|escapejs }}",
                    icon: "{% if 'success' in message.tags %}success{% elif 'error' in message.tags %}
                        error{% elif 'warning' in message.tags %}warning{% else %}info{% endif %}",
                    toast: true,
                    position: 'top-end',
                    showConfirmButton: false,
                    timer: 4000,
                    timerProgressBar: true,
                    background: '#1a1007',
                    color: '#f5e6c8',
                    iconColor: '#d4aa47',
                    customClass: {
                        popup: 'bendy-toast-popup',
                        title: 'bendy-toast-title',
                    }
                });
            {% endfor %}
        });
    </script>
{% endif %}
